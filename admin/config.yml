backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "news"
    label: "სიახლეები"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "სათაური", name: "title", widget: "string" }
      - { label: "კატეგორია", name: "category", widget: "string" }
      - { label: "ფოტო", name: "image", widget: "image", required: false }
      - { label: "მოკლე აღწერა", name: "description", widget: "text" }
      - { label: "ტექსტი", name: "body", widget: "markdown" }
      - { label: "თარიღი", name: "date", widget: "datetime" }
